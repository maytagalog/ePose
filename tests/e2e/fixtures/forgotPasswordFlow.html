<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>Forgot Password fixture</title>
</head>
<body>
  <div id="login-view" data-route="login">
    <button type="button" id="forgot-open" aria-label="パスワードを忘れた方はこちら">パスワードを忘れた方はこちら</button>
  </div>
  <div id="reset-view" data-route="reset-password" hidden>
    <input type="email" aria-label="メールアドレス" id="reset-email" />
    <button type="button" id="reset-send" disabled>送信する</button>
    <button type="button" id="reset-back-login">ログイン画面へもどる</button>
  </div>
  <div id="new-password-view" hidden>
    <input type="text" id="otp" />
    <input type="password" id="pw1" />
    <input type="password" id="pw2" />
    <button type="button" id="confirm-send" disabled>パスワードを登録する</button>
  </div>
  <div id="success-view" hidden>
    <span id="success-headline">新しいパスワードを設定しました。</span>
    <button type="button" id="return-login">ログイン画面へもどる</button>
  </div>
  <div id="customers-view" data-route="customers" hidden>
    <main role="main"><h3>顧客一覧</h3></main>
    <div class="btn-label">新規登録</div>
    <div role="tablist"><button type="button" role="tab">顧客</button></div>
  </div>
  <script>
    window.__fixtureOtp = window.__fixtureOtp ?? '042913';
    window.__suppressSuccess = window.__suppressSuccess ?? false;
    const resetEmail = document.getElementById('reset-email');
    const resetSend = document.getElementById('reset-send');
    const confirmSend = document.getElementById('confirm-send');
    const otp = document.getElementById('otp');
    const pw1 = document.getElementById('pw1');
    const pw2 = document.getElementById('pw2');

    function show(id) {
      ['login-view','reset-view','new-password-view','success-view','customers-view'].forEach(v => {
        document.getElementById(v).hidden = v !== id;
      });
    }

    document.getElementById('forgot-open').addEventListener('click', () => {
      show('reset-view');
      history.pushState({}, '', '/reset-password');
    });

    resetEmail.addEventListener('input', () => {
      resetSend.disabled = !resetEmail.value;
    });

    resetSend.addEventListener('click', () => {
      show('new-password-view');
    });

    function refreshConfirmEnabled() {
      confirmSend.disabled = !(otp.value && pw1.value && pw2.value);
    }
    [otp, pw1, pw2].forEach(el => el.addEventListener('input', refreshConfirmEnabled));

    confirmSend.addEventListener('click', () => {
      if (window.__suppressSuccess) {
        return;
      }
      show('success-view');
    });

    document.getElementById('return-login').addEventListener('click', () => {
      show('login-view');
      history.pushState({}, '', '/login');
    });

    document.getElementById('reset-back-login').addEventListener('click', () => {
      show('login-view');
      history.pushState({}, '', '/login');
    });

    window.__fixtureCompleteLogin = () => {
      show('customers-view');
      history.pushState({}, '', '/customers');
    };
  </script>
</body>
</html>
