<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>My Page profile hydration fixture</title>
</head>
<body>
  <p id="profile-label">プロフィール</p>
  <form id="profile-form">
    <input type="text" role="textbox" aria-label="person in charge" id="tb0" value="" />
    <input type="text" role="textbox" aria-label="furigana" id="tb1" value="" />
    <input type="text" role="textbox" aria-label="display name" id="tb2" value="" />
    <button type="button">保 存</button>
  </form>
  <script>
    const params = new URLSearchParams(window.location.search);
    const delayMs = Number(params.get('delayMs') ?? '600');
    const stale = params.get('stale') === '1';
    window.__HYDRATE_TARGET__ = {
      personInCharge: 'Hydrated PIC',
      furigana: 'テストミズ',
      displayName: 'Hydrated Display',
    };
    setTimeout(() => {
      if (!stale) {
        document.getElementById('tb0').value = window.__HYDRATE_TARGET__.personInCharge;
        document.getElementById('tb1').value = window.__HYDRATE_TARGET__.furigana;
        document.getElementById('tb2').value = window.__HYDRATE_TARGET__.displayName;
      }
    }, delayMs);
  </script>
</body>
</html>
