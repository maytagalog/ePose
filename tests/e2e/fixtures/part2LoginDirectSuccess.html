<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>Part 2 login fixture — direct success</title>
</head>
<body>
  <form id="login-form">
    <input type="email" role="textbox" aria-label="メールアドレス" name="email" />
    <input type="password" role="textbox" aria-label="パスワード" name="password" />
    <button type="submit">ログイン</button>
  </form>
  <script>
    document.getElementById('login-form').addEventListener('submit', function (e) {
      e.preventDefault();
      window.location.assign('/customers');
    });
  </script>
</body>
</html>
