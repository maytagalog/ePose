<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>お支払い情報入力</title>
  <style>
    .payment-information { max-width: 640px; margin: 24px auto; }
    .billing-total { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #ddd; }
    .billing-footer { margin-top: 24px; padding-top: 16px; border-top: 2px solid #333; text-align: right; }
    .billing-footer-price { font-size: 1.25rem; font-weight: 600; }
  </style>
</head>
<body>
  <main class="payment-information">
    <h1>お支払い情報入力</h1>
    <section aria-label="ご請求内容">
      <div class="billing-total">
        <div>3ヶ月プラン</div>
        <div>¥29,400</div>
      </div>
    </section>
    <footer class="billing-footer">
      <span>合計金額</span>
      <div class="billing-footer-price">¥29,400</div>
    </footer>
  </main>
</body>
</html>
